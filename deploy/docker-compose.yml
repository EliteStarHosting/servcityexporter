services:
  servcityexporter:
    image: ghcr.io/elitestarhosting/servcityexporter:latest
    restart: unless-stopped
    environment:
      SERVCITY_API_KEY_ID: ${SERVCITY_API_KEY_ID:?set SERVCITY_API_KEY_ID in .env}
      SERVCITY_API_KEY_SECRET: ${SERVCITY_API_KEY_SECRET:?set SERVCITY_API_KEY_SECRET in .env}
    ports:
      - "9420:9420"

  prometheus:
    image: prom/prometheus:latest
    restart: unless-stopped
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    ports:
      - "9090:9090"
    depends_on:
      - servcityexporter

  grafana:
    image: grafana/grafana:latest
    restart: unless-stopped
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-admin}
    volumes:
      - grafana-data:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
    ports:
      - "3000:3000"
    depends_on:
      - prometheus

volumes:
  prometheus-data:
  grafana-data:
